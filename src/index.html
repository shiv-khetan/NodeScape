<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NodeScape</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/network.css">
  <link rel="stylesheet" href="styles/system.css">
  <link rel="stylesheet" href="styles/sudo.css">
  <link rel="stylesheet" href="styles/services.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="styles/terminal.css">
  <link rel="stylesheet" href="styles/files.css">
  <link rel="stylesheet" href="styles/onboarding.css">
  <link rel="stylesheet" href="styles/accounts.css">
</head>
<body>
  <header class="sidebar" aria-label="Application">
    <div class="brand" aria-label="NodeScape"><span class="brand-mark" aria-hidden="true"><svg viewBox="4 4 92 92" aria-hidden="true" class="dot-logo"><circle cx="18" cy="18" r="7"/><circle cx="34" cy="18" r="2.64" opacity="0.28"/><circle cx="50" cy="18" r="2.5" opacity="0.28"/><circle cx="66" cy="18" r="2.64" opacity="0.28"/><circle cx="82" cy="18" r="7"/><circle cx="18" cy="34" r="7"/><circle cx="34" cy="34" r="7"/><circle cx="50" cy="34" r="1.9" opacity="0.28"/><circle cx="66" cy="34" r="2.15" opacity="0.28"/><circle cx="82" cy="34" r="7"/><circle cx="18" cy="50" r="7"/><circle cx="34" cy="50" r="1.9" opacity="0.28"/><circle cx="50" cy="50" r="7"/><circle cx="66" cy="50" r="1.9" opacity="0.28"/><circle cx="82" cy="50" r="7"/><circle cx="18" cy="66" r="7"/><circle cx="34" cy="66" r="2.15" opacity="0.28"/><circle cx="50" cy="66" r="1.9" opacity="0.28"/><circle cx="66" cy="66" r="7"/><circle cx="82" cy="66" r="7"/><circle cx="18" cy="82" r="7"/><circle cx="34" cy="82" r="2.64" opacity="0.28"/><circle cx="50" cy="82" r="2.5" opacity="0.28"/><circle cx="66" cy="82" r="2.64" opacity="0.28"/><circle cx="82" cy="82" r="7"/></svg></span><span class="sidebar-label">NodeScape</span></div>
    <label class="pillbar hostbox" title="Saved server">
      <span class="host-mono" aria-hidden="true"></span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      <select id="host" aria-label="Server"><option value="">Select a server</option></select>
    </label><div class="server-actions">
    <button class="pill" id="addServer" aria-label="Add server" title="Add server"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="sidebar-label">Add server</span></button>
    <button class="pill" id="manageServers" aria-label="Manage servers" title="Manage servers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M4 12h16M4 18h9"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="sidebar-label">Manage servers</span></button>
</div><nav id="nav" aria-label="Pages"><button data-view="overview" aria-label="Overview" title="Overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="sidebar-label">Overview</span></button><button data-view="services" aria-label="Services" title="Services"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span class="sidebar-label">Services</span></button><button data-view="processes" aria-label="Processes" title="Processes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="sidebar-label">Processes</span></button><button data-view="logs" aria-label="Logs" title="Logs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg><span class="sidebar-label">Logs</span></button><button data-view="timers" aria-label="Scheduled" title="Scheduled"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/></svg><span class="sidebar-label">Scheduled</span></button><button data-view="network" aria-label="Network" title="Network"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="6" rx="1"/><path d="M12 9v5M5 14h14M5 14v3M19 14v3"/><rect x="2" y="17" width="6" height="4" rx="1"/><rect x="16" y="17" width="6" height="4" rx="1"/></svg><span class="sidebar-label">Network</span></button><button data-view="terminal" aria-label="Terminal" title="Terminal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span class="sidebar-label">Terminal</span></button><button data-view="files" aria-label="Files" title="Files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3"/></svg><span class="sidebar-label">Files</span></button><button data-view="accounts" aria-label="Users" title="Users"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></svg><span class="sidebar-label">Users</span></button></nav><div class="sidebar-bottom"><button class="round" id="paletteBtn" title="Commands (Ctrl+K)" aria-label="Commands" aria-keyshortcuts="Control+K"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button class="round" id="refresh" title="Refresh (Ctrl+R)" aria-label="Refresh" aria-keyshortcuts="Control+R">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    <button class="round" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.5 3-2 1.2L3.6 6.7l-2 3.5 2.3 2v2.3l-2.3 2 2 3.5 2.9-.5 2 1.2.5 3h4l.5-3 2-1.2 2.9.5 2-3.5-2.3-2v-2.3l2.3-2-2-3.5-2.9.5-2-1.2L13 3z" transform="translate(1 -1) scale(.95)"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
</div></header>
  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label for="sshConfig">Default SSH config for new servers</label>
      <input id="sshConfig" class="field" placeholder="Blank = ~/.ssh/config, e.g. C:\path\to\ssh\config" spellcheck="false">
      <p class="muted">Each saved server keeps its own config. This default applies when adding a server.</p>
      <div class="dlg-actions"><button value="cancel" class="pill">Cancel</button><button value="save" class="pill primary">Save</button></div>
    </form>
  </dialog>
  <main id="main"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
