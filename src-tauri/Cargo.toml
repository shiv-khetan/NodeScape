[package]
name = "nodescape"
version = "0.1.0"
edition = "2021"
# Keep the test helper from ever being selected as the application.
default-run = "nodescape"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
