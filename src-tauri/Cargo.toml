[package]
name = "nodescape"
version = "0.1.0"
edition = "2021"
description = "Desktop control panel for Linux servers over SSH"
license = "Apache-2.0"
# Keep the test helper from ever being selected as the application.
default-run = "nodescape"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Wipe per-action sudo passwords and scripts when they leave scope.
zeroize = "1"

tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt", "fs"] }

russh-sftp = "=2.4.0"
tauri-plugin-dialog = "2"

portable-pty = "0.9"
# Content fingerprint so the editor never overwrites a concurrent change.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
